services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: imprelapp
      POSTGRES_USER: imprelapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imprelapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - imprelapp

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://imprelapp:${POSTGRES_PASSWORD}@db:5432/imprelapp
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WEB_URL: ${WEB_URL}
      UPLOAD_DIR: /app/uploads
      PORT: 3001
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - imprelapp
      - coolify

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - api
    networks:
      - imprelapp
      - coolify

networks:
  imprelapp:
    driver: bridge
  coolify:
    external: true
    name: coolify

volumes:
  postgres_data:
  uploads_data:
